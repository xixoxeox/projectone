services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-screener}
      POSTGRES_USER: ${POSTGRES_USER:-screener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screener}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@db:5432/${POSTGRES_DB:-screener}
      SCHEDULER_ENABLED: "false"
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"], interval: 10s, timeout: 5s, retries: 5}
  frontend:
    build: {context: ./frontend, args: {NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-http://localhost:8000/api/v1}}}
    environment: {NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-http://localhost:8000/api/v1}}
    ports: ["3000:3000"]
    depends_on: {backend: {condition: service_healthy}}
  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@db:5432/${POSTGRES_DB:-screener}
      SCHEDULER_ENABLED: "true"
    depends_on: {db: {condition: service_healthy}}
    profiles: [scheduler]
volumes: {postgres_data: {}}
