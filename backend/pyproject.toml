[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swing-screener-backend"
version = "0.1.0"
description = "Swing Trading Screener API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1", "alembic>=1.16,<2", "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3",
  "httpx>=0.28,<1", "apscheduler>=3.11,<4"
]
[project.optional-dependencies]
dev = ["aiosqlite>=0.21,<1", "httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.0,<2", "ruff>=0.12,<1", "mypy>=1.16,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/screener"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
